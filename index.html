<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CLYD Manager</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="logo-container">
            <!-- Remplacez 'logo.png' par le nom exact de votre fichier image -->
            <img src="logo.png" alt="CLYD Logo" class="logo-img">
            <div>
                <p style="font-size:10px; color:var(--text-muted); font-weight:600;">ENTREPRISE</p>
                <h1>CLYD</h1>
            </div>
        </div>
        <div class="user-switcher" onclick="cycleUser()">
            <i class="fa-solid fa-user-circle"></i>
            <span id="current-user-name">Chargement...</span>
            <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
        </div>
    </header>

    <!-- PAGE: ACCUEIL -->
    <div id="page-home" class="app-page active">
        <div class="hero-card">
            <p>Valeur Nette de l'Entreprise</p>
            <h2 id="net-worth">0 CFA</h2>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <h4>Revenus (Mois)</h4>
                <div class="value" id="total-revenue" style="color: var(--success);">0 CFA</div>
            </div>
            <div class="stat-card">
                <h4>Dépenses (Mois)</h4>
                <div class="value" id="total-expense" style="color: var(--danger);">0 CFA</div>
            </div>
        </div>

        <h3 style="font-size: 16px; margin-bottom: 12px;">Dernières Activités</h3>
        <div id="recent-activities"></div>
    </div>

    <!-- PAGE: PRODUITS -->
    <div id="page-products" class="app-page">
        <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Produits & Stock</h3>
        <div id="products-list"></div>
    </div>

    <!-- PAGE: DETTES -->
    <div id="page-debts" class="app-page">
        <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Gestion des Dettes</h3>
        <div id="debts-list"></div>
    </div>

    <!-- PAGE: ACTIFS -->
    <div id="page-assets" class="app-page">
        <h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px;">Biens & Actifs</h3>
        <div class="stat-card" style="margin-bottom:15px; border-left-color: var(--accent-black);">
            <h4>Valeur Totale des Actifs</h4>
            <div class="value" id="total-assets-value">0 CFA</div>
        </div>
        <div id="assets-list"></div>
    </div>

    <!-- BOUTON FLOTTANT -->
    <button class="fab" onclick="openModal()"><i class="fa-solid fa-plus"></i></button>

    <!-- MODAL D'AJOUT -->
    <div id="add-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-bottom:20px;">Nouvelle entrée</h3>
            <form id="dynamic-form" onsubmit="handleFormSubmit(event)">
                <!-- Champs injectés par JS -->
            </form>
            <button type="button" class="btn-cancel" onclick="closeModal()">Annuler</button>
        </div>
    </div>

    <!-- NAVIGATION -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="navigate('home', this)"><i class="fa-solid fa-house"></i><span>Accueil</span></div>
        <div class="nav-item" onclick="navigate('products', this)"><i class="fa-solid fa-box"></i><span>Stock</span></div>
        <div class="nav-item" onclick="navigate('debts', this)"><i class="fa-solid fa-hand-holding-dollar"></i><span>Dettes</span></div>
        <div class="nav-item" onclick="navigate('assets', this)"><i class="fa-solid fa-building"></i><span>Actifs</span></div>
    </nav>

    <script src="app.js"></script>
    <script>
        // Enregistrement du Service Worker pour la PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('SW enregistré', reg))
                .catch(err => console.log('Erreur SW', err));
        }
    </script>
</body>
</html>
